# Noctalia v5 settings. Tracked in ~/dotfiles/noctalia; the settings UI and
# `noctalia msg config-set` write back to this file.

[idle.behavior.lock]          # was: swayidle timeout 600 swaylock
enabled = true
timeout = 600.0

[idle.behavior.screen-off]    # was: swayidle timeout 700 output * power off
enabled = true
timeout = 700.0

[lockscreen]                  # was: swaylock -i $darkwallpaper
wallpaper = "/home/jemag/wallpapers/nix.png"

[wallpaper]                   # picker shows ~/wallpapers; the active image is set once
directory = "/home/jemag/wallpapers"   # with `noctalia msg wallpaper-set` (kept in ~/.local/state)

[theme]                       # Ayu (dark) from the Noctalia community palettes
source = "community"
community_palette = "Ayu Blue"
mode = "dark"

    # User copy of the umbriel template (see templates/umbriel.toml). Umbriel
    # hot-reloads the include, so no post_hook is needed.
    [theme.templates.user.umbriel]
    input_path = "templates/umbriel.toml"
    output_path = "$XDG_CONFIG_HOME/umbriel/noctalia.toml"
