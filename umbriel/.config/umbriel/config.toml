# Umbriel config: translated from ~/dotfiles/sway/.config/sway/config
# Reference: https://docs.noctalia.dev/umbriel/  ·  check: umbriel config validate

[general]
mod_key = "Super"
autostart = ["noctalia"]

# Colours come from Noctalia's "umbriel" theme template (Ayu palette), which
# writes noctalia.toml next to this file. Optional so a fresh checkout still loads.
[include.optional]
# Later files win; config.toml itself is applied last, so `gap` lives in gaps.toml.
files = ["gaps.toml", "noctalia.toml", "gaps-override.toml", "tabbar-override.toml"]

# ------------------------------------------------------------------ outputs
# was sway/.config/sway/outputs (nwg-displays)
[output.DP-2]
mode = "2560x1440@143.912"
position = [0, 0]
scale = 1.0
tearing = true
workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
focus_at_startup = true

[output.HDMI-A-1]
mode = "1920x1080@60"
position = [323, 1440]
scale = 1.0
workspaces = ["10"]

[workspaces]
back_and_forth = false   # Mod+N on the current workspace stays put; Mod+A = previous

# ------------------------------------------------------------------ input
[input.keyboard]
layout = "us,ca"
options = "grp:win_space_toggle"
repeat_delay = 200
repeat_rate = 50

[input.mouse]
accel_profile = "flat"
sensitivity = 0.5

[input.focus]
follows_mouse = true

# ------------------------------------------------------------------ look
[layout]
mode = "scrolling"
# extent_presets = [0.333, 0.5, 0.667, 1.0]
extent_presets = [0.5, 1.0]

[layout.scrolling]
default_extent_fraction = 1.0   # new windows open full width (sway stack feel)

# sway "layout stacking" equivalent: one window visible per column, title bar above.
# Mod+W flips a column between tabbed and normal (rows stacked vertically).
[layout.tabs]
default_display = "normal"
new_tab_position = "after_active"
middle_click_closes = true          # was: bindsym --release button2 kill

[appearance]
border_width = 3

# Tab bar (window title strip above a tabbed column): hidden while a column holds
# a single window; Mod+Shift+W toggles it per column, Mod+Ctrl+W everywhere.
[appearance.tab_bar]
hide_when_single = false

# ------------------------------------------------------------------ scratchpad
[[scratchpad]]
name = "main"

# ------------------------------------------------------------------ keybinds
# Defining [keybinds] replaces Umbriel's built-in set entirely.
[keybinds]
# apps / session
"Mod+Return" = { action = "spawn:ghostty", repeat = false }
"Mod+P" = { action = "spawn:noctalia msg panel-toggle launcher", repeat = false }
"Mod+O" = { action = "spawn:noctalia msg panel-toggle launcher '/win '", repeat = false }
"Mod+Shift+Q" = { action = "window-close", repeat = false }
"Mod+Shift+Slash" = { action = "cheatsheet-toggle", repeat = false }
"Mod+Shift+C" = "config-reload"
"Mod+Shift+E" = "session-quit"
"Mod+Shift+X" = { action = "spawn:noctalia msg session lock", repeat = false }
"Mod+T" = { action = "spawn:noctalia msg bar-toggle", repeat = false }
"Print" = { action = "spawn:noctalia msg screenshot-region", repeat = false }

# focus
"Mod+H" = "window-focus-left"
"Mod+J" = "window-focus-or-workspace-down"        # tabs of the focused column (sway stack feel)
"Mod+K" = "window-focus-or-workspace-up"
"Mod+Alt+J" = "column-focus-tab-next"        # rows of the column (stacked / multiple tab groups)
"Mod+Alt+K" = "column-focus-tab-previous"
"Mod+L" = "window-focus-right"
"Mod+Left" = "window-focus-left"
"Mod+Down" = "window-focus-down"
"Mod+Up" = "window-focus-up"
"Mod+Right" = "window-focus-right"
"Mod+Tab" = "window-focus-last"          # replaces sway-switch-window-script.sh + _prev mark

# move
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+J" = "window-move-down"
"Mod+Shift+K" = "window-move-up"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+Down" = "window-move-down"
"Mod+Shift+Up" = "window-move-up"
"Mod+Shift+Right" = "column-move-right"

# layout
"Mod+V" = "window-consume-or-expel-left"     # was: split v
"Mod+Shift+V" = "window-consume-or-expel-right" # was: split h
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }        # tabbed <-> stacked rows
"Mod+Ctrl+W" = { action = "column-toggle-tab-bar", repeat = false } # show/hide this column's title bar
"Mod+Shift+W" = { action = "spawn:sh ~/.config/umbriel/toggle-override.sh tabbar '[appearance.tab_bar]\\nvisible = false'", repeat = false } # tab bars on/off everywhere
"Mod+G" = { action = "spawn:sh ~/.config/umbriel/toggle-override.sh gaps '[layout]\\ngap = 0'", repeat = false }  # gaps on/off
"Mod+Shift+G" = { action = "window-toggle-maximize-to-edges", repeat = false }      # this window: no gaps/borders
"Mod+E" = "window-cycle-primary-extent"       # column width presets
"Mod+C" = "column-center"
"Mod+I" = { action = "overview-toggle", repeat = false }
"Mod+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize", repeat = false } # full-width column
"Mod+MouseMiddle" = "layout-scroll-drag"
"Mod+WheelUp" = "window-focus-left"
"Mod+WheelDown" = "window-focus-right"
"Mod+Shift+Space" = { action = "window-toggle-floating", repeat = false }
"Mod+Space" = { action = "window-focus-switch-floating", repeat = false }

# scratchpad
"Mod+U" = "scratchpad-toggle:main"
# move window to scratch pad
"Mod+Shift+U" = { action = "window-toggle-scratchpad:main", repeat = false }

# workspaces
"Mod+A" = "workspace-focus-last"
"Mod+1" = "workspace-switch:1/DP-2"
"Mod+2" = "workspace-switch:2/DP-2"
"Mod+3" = "workspace-switch:3/DP-2"
"Mod+4" = "workspace-switch:4/DP-2"
"Mod+5" = "workspace-switch:5/DP-2"
"Mod+6" = "workspace-switch:6/DP-2"
"Mod+7" = "workspace-switch:7/DP-2"
"Mod+8" = "workspace-switch:8/DP-2"
"Mod+9" = "workspace-switch:9/DP-2"
"Mod+0" = "workspace-switch:1/HDMI-A-1"   # ws "10" = position 1 on HDMI; bare 10 = position 10 on DP-2 (none)
"Mod+Shift+1" = "window-move-to-workspace-silent:1/DP-2"
"Mod+Shift+2" = "window-move-to-workspace-silent:2/DP-2"
"Mod+Shift+3" = "window-move-to-workspace-silent:3/DP-2"
"Mod+Shift+4" = "window-move-to-workspace-silent:4/DP-2"
"Mod+Shift+5" = "window-move-to-workspace-silent:5/DP-2"
"Mod+Shift+6" = "window-move-to-workspace-silent:6/DP-2"
"Mod+Shift+7" = "window-move-to-workspace-silent:7/DP-2"
"Mod+Shift+8" = "window-move-to-workspace-silent:8/DP-2"
"Mod+Shift+9" = "window-move-to-workspace-silent:9/DP-2"
"Mod+Shift+0" = "window-move-to-workspace-silent:1/HDMI-A-1"

# resize submap (was: mode "resize")
"Mod+R" = { action = "submap:resize", repeat = false }
"submap[resize],H" = "window-modify-primary-extent:-0.05"
"submap[resize],L" = "window-modify-primary-extent:0.05"
"submap[resize],K" = "window-modify-secondary-extent:-0.05"
"submap[resize],J" = "window-modify-secondary-extent:0.05"
"submap[resize],Left" = "window-modify-primary-extent:-0.05"
"submap[resize],Right" = "window-modify-primary-extent:0.05"
"submap[resize],Up" = "window-modify-secondary-extent:-0.05"
"submap[resize],Down" = "window-modify-secondary-extent:0.05"
"submap[resize],Return" = "submap:reset"
"submap[resize],Escape" = "submap:reset"

# audio / media (routed through Noctalia for OSDs)
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up 3", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down 3", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true }
"Mod+F10" = { action = "spawn:noctalia msg volume-up 3", allow_when_locked = true }
"Mod+F9" = { action = "spawn:noctalia msg volume-down 3", allow_when_locked = true }
"Mod+F8" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"Mod+F6" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"Mod+F7" = { action = "spawn:noctalia msg media next", allow_when_locked = true }
"Mod+F5" = { action = "spawn:noctalia msg media previous", allow_when_locked = true }

# ------------------------------------------------------------------ window rules
[[window_rule]]
match.app_id = ["^nixnote2$", "^org.gnome.Calculator$"]
default_scratchpad = "main"

[[window_rule]]
match.title = ["^Qalculate!$", "^Pebbles$", "^Uno Calculator$", "^Microsoft Teams Notification$"]
default_floating = true

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true
blur_optimized = false
